apply plugin: 'com.android.application'

android {
    namespace = "audio.cup.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "audio.cup.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // `io.sentry.android.core.InMemoryInstallation` reaches into this version's package-private
    // `Installation`; the check below keeps it equal to the version @sentry/capacitor brings.
    implementation "io.sentry:sentry-android-core:$sentryAndroidVersion"
    // The narration track's engine and the media session that keeps it playing in the background.
    implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"
    implementation "androidx.media3:media3-session:$androidxMedia3Version"
    // The mobile E2E suite's launch arguments (src/debug) inject a document-start script.
    debugImplementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Fails every build whose pinned Sentry Android core differs from the `io.sentry:sentry-android`
// version that @sentry/capacitor's native plugin declares: an update of the plugin must move the pin,
// after checking that the in-memory installation ID still works with that version.
gradle.projectsEvaluated {
    def sentryPlugin = rootProject.findProject(':sentry-capacitor')
    if (sentryPlugin == null) {
        throw new GradleException("The @sentry/capacitor native plugin is missing; run `cap sync android`.")
    }
    def broughtVersion = sentryPlugin.configurations.getByName('implementation').dependencies
        .find { it.group == 'io.sentry' && it.name == 'sentry-android' }?.version
    if (broughtVersion != sentryAndroidVersion) {
        throw new GradleException(
            "sentry-android-core is pinned to ${sentryAndroidVersion} in variables.gradle, but @sentry/capacitor " +
            "brings io.sentry:sentry-android ${broughtVersion}. Set sentryAndroidVersion to ${broughtVersion} and " +
            "check that the in-memory installation ID (io.sentry.android.core.InMemoryInstallation) still works."
        )
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
