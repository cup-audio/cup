name: Rotate Apple client secret

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rotate-apple-client-secret
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate Supabase's Apple client secret
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
    env:
      SENTRY_CHECK_IN_URL: https://o4512441473040384.ingest.de.sentry.io/api/4512441485623377/cron/apple-client-secret-rotation/aa6ceda71485efec30877677d4eb919b/
    steps:
      - name: Fetch the source of the commit
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --quiet --detach FETCH_HEAD

      - name: Check the Supabase access token's expiry
        env:
          SUPABASE_ACCESS_TOKEN_EXPIRES_ON: ${{ vars.SUPABASE_ACCESS_TOKEN_EXPIRES_ON }}
        run: node tooling/apple-client-secret/src/cli.ts check-token-expiry

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Authenticate to the Terraform state bucket
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/646301813623/locations/global/workloadIdentityPools/github/providers/github
          service_account: apple-client-secret-rotation@cup-infrastructure.iam.gserviceaccount.com

      - name: Sign the client secret and apply it to Supabase
        env:
          APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TF_VAR_apple_client_secret="$(node tooling/apple-client-secret/src/cli.ts sign)"
          echo "::add-mask::${TF_VAR_apple_client_secret}"
          export TF_VAR_apple_client_secret
          unset APPLE_SIGN_IN_PRIVATE_KEY
          terraform -chdir=terraform/apple-client-secret init -input=false
          terraform -chdir=terraform/apple-client-secret apply -input=false -auto-approve

      - name: Check in to the Sentry cron monitor
        run: curl --fail --silent --show-error --max-time 30 "${SENTRY_CHECK_IN_URL}?status=ok"
